services:
  - type: web
    name: escaner-test
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: MODEL
        value: claude-sonnet-4-6
      - key: NODE_VERSION
        value: 20
